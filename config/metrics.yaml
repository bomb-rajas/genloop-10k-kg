# Canonical metrics. synonyms: as-reported line-item labels (normalised by src/extract.norm: lowercase,
# punctuation to spaces, footnote markers removed). Match order: synonyms (exact) -> label_regex ->
# prefix of a multi-word synonym (rest of label must not contain exclude words) -> fallback_labels (exact, prefix).
# identity: derived value when no direct row exists (method 'identity'): sum(plus) - sum(minus).
# xbrl_tags: us-gaap concepts used only by the validation gate (src/validate.py), never as an answer source.
# applies_to: all (non-bank and bank) | nonbank. Bank metrics = the applies_to: all subset (6).
# derived: computed from canonical metrics; formula documented, not extracted.
metrics:
  - name: Revenue
    category: income
    statement: income_statement
    applies_to: all
    unit: USD
    synonyms: [total net sales, total revenues, total revenue, total net revenue, total net revenues, net sales, net revenues, net revenue, net operating revenues, sales to customers, net sales and revenue, revenues, revenue, sales]
    label_regex: ['^total [a-z ]*revenues?$']
    exclude: [cost, other income, non]
    identity: {plus: [NetInterestIncome, TotalNonInterestIncome], banks_only: true}  # no printed total-revenue row (COF)
    xbrl_tags: [Revenues, RevenuesNetOfInterestExpense, RevenueFromContractWithCustomerExcludingAssessedTax, RevenueFromContractWithCustomerIncludingAssessedTax, SalesRevenueNet]

  - name: NetIncome
    category: income
    statement: income_statement
    applies_to: all
    unit: USD
    synonyms: [net income attributable to company, net income attributable to shareholders, net earnings attributable to, net income attributable to merck co inc]
    label_regex: ['^net (income|earnings)( loss)? attributable to (?!.*non ?controlling)', '^consolidated net (income|earnings) attributable to (?!.*non ?controlling)', '^net income applicable to (?!.*(non ?controlling|common))', "^[a-z ]+s net income$"]  # 'applicable to common' sits after preferred dividends (JPM, BAC)
    exclude: [per share, per common share, noncontrolling, non controlling, discontinued, continuing]
    fallback_labels: [net income, net earnings, net income loss, consolidated net income]
    xbrl_tags: [NetIncomeLoss]

  - name: EPS
    category: income
    statement: income_statement
    applies_to: all
    unit: USD/share
    synonyms: [diluted earnings per share, diluted net income per share, diluted earnings per common share, earnings per common share assuming dilution]
    label_regex: ['^diluted earnings$', '\bper (common )?(diluted|dilution)|(diluted|dilution).*\bper (common )?share|\bper (common )?share.*(diluted|dilution)']
    exclude: [basic]
    prefer_exclude: [continuing, discontinued]
    fallback_labels: [diluted, basic]
    xbrl_tags: [EarningsPerShareDiluted]
    basic_xbrl_tags: [EarningsPerShareBasic]  # rows labelled 'Basic' (fallback)

  - name: TotalAssets
    category: balance
    statement: balance_sheet
    applies_to: all
    unit: USD
    synonyms: [total assets]
    exclude: [held for sale]
    identity: {plus: [TotalLiabilitiesAndEquity]}
    xbrl_tags: [Assets]

  - name: TotalLiabilities
    category: balance
    statement: balance_sheet
    applies_to: all
    unit: USD
    synonyms: [total liabilities]
    identity: {plus: [TotalLiabilitiesAndEquity], minus: [TotalEquityInclNCI]}
    xbrl_tags: [Liabilities]

  - name: Equity
    category: balance
    statement: balance_sheet
    applies_to: all
    unit: USD
    synonyms: [total common stockholders equity, stockholders equity, shareholders equity]
    label_regex: ['^total (?!liabilities)[a-z]+( [a-z]+)* (stockholders|shareholders) (equity|investment|deficit)$', '^(total )?equity attributable to (?!.*non ?controlling)']  # one or more name words: 'Total Intel stockholders equity' is parent, bare 'Total stockholders equity' is NCI-inclusive
    exclude: [noncontrolling, non controlling]
    fallback_labels: [total stockholders equity, total shareholders equity, total shareholders investment, total shareholders deficit, total equity]  # NCI-inclusive totals only when no parent row
    xbrl_tags: [StockholdersEquity]

  - name: GrossProfit
    category: income
    statement: income_statement
    applies_to: nonbank
    unit: USD
    synonyms: [gross profit, gross income, total gross profit, gross margin]
    xbrl_tags: [GrossProfit]

  - name: OperatingIncome
    category: income
    statement: income_statement
    applies_to: nonbank
    unit: USD
    synonyms: [operating income, operating earnings, earnings from operations, income from operations, operating profit, total operating income, operating income (loss), income (loss) from operations]
    xbrl_tags: [OperatingIncomeLoss]

  - name: OperatingCashFlow
    category: cashflow
    statement: cash_flow_statement
    applies_to: all
    unit: USD
    synonyms: [net cash from operations, cash provided by operations, cash flows from operating activities, total operating activities, net cash provided by operating activities, net cash from operating activities, cash generated by operating activities, net cash provided by (used in) operating activities, cash provided by operating activities, net cash flows from operating activities, net cash used for operating activities, net cash provided by (used for) operating activities, net cash used in operating activities]
    xbrl_tags: [NetCashProvidedByUsedInOperatingActivities]

  - name: CapEx
    category: cashflow
    statement: cash_flow_statement
    applies_to: nonbank
    unit: USD
    absolute: true  # reported as a negative outflow; stored positive (D-057)
    synonyms: [payments for acquisition of property plant and equipment, payments for property and equipment, purchases of property and equipment, capital expenditures, additions to property and equipment, payments to acquire property plant and equipment, property and equipment additions, capital spending]
    label_regex: ['^(purchases?|payments?|additions?|expenditures|acquisitions) (of |for |to |related to )?(property|capital)', '^capital (expenditures|spending)']
    xbrl_tags: [PaymentsToAcquirePropertyPlantAndEquipment]

  - name: R&D
    category: income
    statement: income_statement
    applies_to: nonbank
    unit: USD
    synonyms: [research and development, research and development expense, research and development expenses, research and development costs, research development and engineering]
    xbrl_tags: [ResearchAndDevelopmentExpense, ResearchAndDevelopmentExpenseExcludingAcquiredInProcessCost]  # JNJ prints R&D excluding IPR&D impairments (same concept)

  - name: Cash
    category: balance
    statement: balance_sheet
    applies_to: nonbank
    unit: USD
    synonyms: [cash and cash equivalents, cash and equivalents, cash and due from banks, cash and cash equivalents at end of period, cash and short-term investments]
    xbrl_tags: [CashAndCashEquivalentsAtCarryingValue]

# count_metrics: non-financial counts taken from text by src/entities.py (M4b). Not statement rows; no synonyms.
count_metrics:
  - name: Employees
    category: count
    applies_to: all
    unit: count

# Helper rows used only as identity inputs (not admitted as facts).
helper_metrics:
  - name: NetInterestIncome
    statement: income_statement
    synonyms: [net interest income]

  - name: TotalNonInterestIncome
    statement: income_statement
    synonyms: [total non interest income, total noninterest income, total other revenue, total non interest revenue]

  - name: TotalLiabilitiesAndEquity
    statement: balance_sheet
    synonyms: [total liabilities and equity, total liabilities and stockholders equity, total liabilities and shareholders equity]
    label_regex: ['^total liabilities (redeemable )?(non ?controlling interest )?and (stockholders|shareholders) (equity|investment|deficit)']

  - name: TotalEquityInclNCI
    statement: balance_sheet
    synonyms: [total equity, total stockholders equity, total shareholders equity, total shareholders investment, total shareholders deficit]

derived:
  - name: NetMargin
    applies_to: all
    unit: ratio
    computed_from: [NetIncome, Revenue]
    formula: NetIncome / Revenue

  - name: GrossMargin
    applies_to: nonbank
    unit: ratio
    computed_from: [GrossProfit, Revenue]
    formula: GrossProfit / Revenue
