# Canonical metrics. synonyms: lowercase as-reported line-item labels (matched case-insensitively).
# xbrl_tags: us-gaap concepts used only by the validation gate (never as an answer source).
# applies_to: all (non-bank and bank) | nonbank. Bank metrics = the applies_to: all subset (6).
# derived: computed from canonical metrics; formula is documented, value computed in build_graph.
metrics:
  - name: Revenue
    category: income
    statement: income_statement
    applies_to: all
    unit: USD
    synonyms: [total net sales, net sales, total revenues, total revenue, net revenues, net revenue, revenues, revenue, total net revenue, sales, net sales and revenue]
    xbrl_tags: [Revenues, RevenueFromContractWithCustomerExcludingAssessedTax, RevenueFromContractWithCustomerIncludingAssessedTax, SalesRevenueNet]

  - name: NetIncome
    category: income
    statement: income_statement
    applies_to: all
    unit: USD
    synonyms: [net income, net income attributable to common stockholders, net earnings, net income (loss), net income attributable to company, net income attributable to shareholders, net earnings attributable to]
    xbrl_tags: [NetIncomeLoss, ProfitLoss]

  - name: EPS
    category: income
    statement: income_statement
    applies_to: all
    unit: USD/share
    synonyms: [diluted earnings per share, basic earnings per share, earnings per share, diluted net income per share, basic net income per share, net income per share, earnings per common share]
    xbrl_tags: [EarningsPerShareDiluted, EarningsPerShareBasic]

  - name: TotalAssets
    category: balance
    statement: balance_sheet
    applies_to: all
    unit: USD
    synonyms: [total assets]
    xbrl_tags: [Assets]

  - name: TotalLiabilities
    category: balance
    statement: balance_sheet
    applies_to: all
    unit: USD
    synonyms: [total liabilities]
    xbrl_tags: [Liabilities]

  - name: Equity
    category: balance
    statement: balance_sheet
    applies_to: all
    unit: USD
    synonyms: [total stockholders equity, total shareholders equity, total shareholders' equity, total stockholders' equity, total equity, stockholders equity, shareholders equity, total common stockholders equity]
    xbrl_tags: [StockholdersEquity, StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest]

  - name: GrossProfit
    category: income
    statement: income_statement
    applies_to: nonbank
    unit: USD
    synonyms: [gross profit, gross income, total gross profit]
    xbrl_tags: [GrossProfit]

  - name: OperatingIncome
    category: income
    statement: income_statement
    applies_to: nonbank
    unit: USD
    synonyms: [operating income, income from operations, operating profit, total operating income, operating income (loss), income (loss) from operations]
    xbrl_tags: [OperatingIncomeLoss]

  - name: OperatingCashFlow
    category: cashflow
    statement: cash_flow_statement
    applies_to: nonbank
    unit: USD
    synonyms: [net cash provided by operating activities, net cash from operating activities, cash generated by operating activities, net cash provided by (used in) operating activities, cash provided by operating activities, net cash flows from operating activities]
    xbrl_tags: [NetCashProvidedByUsedInOperatingActivities]

  - name: CapEx
    category: cashflow
    statement: cash_flow_statement
    applies_to: nonbank
    unit: USD
    synonyms: [payments for property and equipment, payments for property, plant and equipment, purchases of property and equipment, capital expenditures, additions to property and equipment, purchases of property, plant and equipment, payments to acquire property, plant and equipment, property and equipment additions]
    xbrl_tags: [PaymentsToAcquirePropertyPlantAndEquipment, PaymentsToAcquireProductiveAssets]

  - name: R&D
    category: income
    statement: income_statement
    applies_to: nonbank
    unit: USD
    synonyms: [research and development, research and development expense, research and development expenses, research and development costs, research, development and engineering]
    xbrl_tags: [ResearchAndDevelopmentExpense, ResearchAndDevelopmentExpenseExcludingAcquiredInProcessCost]

  - name: Cash
    category: balance
    statement: balance_sheet
    applies_to: nonbank
    unit: USD
    synonyms: [cash and cash equivalents, cash and equivalents, cash and due from banks, cash and cash equivalents at end of period, cash and short-term investments]
    xbrl_tags: [CashAndCashEquivalentsAtCarryingValue, CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents]

derived:
  - name: NetMargin
    applies_to: all
    unit: ratio
    computed_from: [NetIncome, Revenue]
    formula: NetIncome / Revenue

  - name: GrossMargin
    applies_to: nonbank
    unit: ratio
    computed_from: [GrossProfit, Revenue]
    formula: GrossProfit / Revenue
